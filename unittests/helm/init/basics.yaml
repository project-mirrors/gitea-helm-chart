suite: Test init secret basics
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/secret_init.yaml
tests:
  - it: "Render the Secret"
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: gitea-unittests-init
