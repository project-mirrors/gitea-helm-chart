suite: Init template
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/secret_init.yaml
tests:
  - it: runs gpg in batch mode
    set:
      deployment.gitea.image.rootless: false
      secrets.gpg.enabled: true
      secrets.gpg.new.privateKey: |-
        -----BEGIN PGP PRIVATE KEY BLOCK-----
        {placeholder}
        -----END PGP PRIVATE KEY BLOCK-----
    asserts:
      - equal:
          path: data["configure_gpg_environment.sh"]
          decodeBase64: true
          value: |
            #!/usr/bin/env bash
            set -eu

            gpg --batch --import "$TMP_RAW_GPG_KEY"
  - it: skips gpg script block for disabled signing
    set:
      deployment.gitea.image.rootless: false
    asserts:
      - equal:
          path: data["init_directory_structure.sh"]
          decodeBase64: true
          value: |-
            #!/usr/bin/env bash

            set -euo pipefail
            chown -v 1000:1000 /data
            mkdir -pv /data/git/.ssh
            chmod -Rv 700 /data/git/.ssh
            [ ! -d /data/gitea/conf ] && mkdir -pv /data/gitea/conf

            # prepare temp directory structure
            mkdir -pv "${GITEA_TEMP}"
            chown -v 1000:1000 "${GITEA_TEMP}"
            chmod -v ug+rwx "${GITEA_TEMP}"
  - it: adds gpg script block for enabled signing
    set:
      deployment.gitea.image.rootless: false
      secrets.gpg.enabled: true
      secrets.gpg.new.privateKey: |-
        -----BEGIN PGP PRIVATE KEY BLOCK-----
        {placeholder}
        -----END PGP PRIVATE KEY BLOCK-----
    asserts:
      - equal:
          path: data["init_directory_structure.sh"]
          decodeBase64: true
          value: |-
            #!/usr/bin/env bash

            set -euo pipefail
            chown -v 1000:1000 /data
            mkdir -pv /data/git/.ssh
            chmod -Rv 700 /data/git/.ssh
            [ ! -d /data/gitea/conf ] && mkdir -pv /data/gitea/conf

            # prepare temp directory structure
            mkdir -pv "${GITEA_TEMP}"
            chown -v 1000:1000 "${GITEA_TEMP}"
            chmod -v ug+rwx "${GITEA_TEMP}"

            if [ ! -d "${GNUPGHOME}" ]; then
              mkdir -pv "${GNUPGHOME}"
              chmod -v 700 "${GNUPGHOME}"
              chown -v 1000:1000 "${GNUPGHOME}"
            fi
  - it: renders data, not stringData, so removed keys are pruned on upgrade
    set:
      deployment.gitea.image.rootless: false
    asserts:
      - notExists:
          path: stringData
      - exists:
          path: data["init_directory_structure.sh"]
