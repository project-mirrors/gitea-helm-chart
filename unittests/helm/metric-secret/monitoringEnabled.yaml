suite: Test metrics secret with monitoring enabled
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/secret_metrics.yaml
tests:
  - it: "Skip rendering when monitoring is enabled and gitea.metrics.token is empty"
    set:
      gitea.metrics.enabled: true
      gitea.metrics.serviceMonitor.enabled: true
      gitea.metrics.token: ""
    asserts:
      - hasDocuments:
          count: 0
  - it: "Render the Secret when monitoring is enabled and gitea.metrics.token is not empty"
    set:
      gitea.metrics.enabled: true
      gitea.metrics.serviceMonitor.enabled: true
      gitea.metrics.token: "test-token"
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        containsDocument:
          kind: Secret
          apiVersion: v1
          name: gitea-unittests-metrics
      - isNotNullOrEmpty:
          path: metadata.labels
      - equal:
          path: data.token
          value: "dGVzdC10b2tlbg=="
