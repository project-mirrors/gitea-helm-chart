suite: Test dependency major image bumps
release:
  name: gitea-unittests
  namespace: testing
tests:
  - it: "[postgresql-ha] Detect major image version upgrades"
    template: charts/postgresql-ha/templates/postgresql/statefulset.yaml
    set:
      postgresql:
        enabled: false
      postgresql-ha:
        enabled: true
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].image
          # IN CASE OF AN INTENTIONAL MAJOR BUMP, ADJUST THIS TEST
          pattern: bitnamilegacy/postgresql-repmgr:17.+$
  - it: "[postgresql] Detect major image version upgrades"
    template: charts/postgresql/templates/primary/statefulset.yaml
    set:
      postgresql:
        enabled: true
      postgresql-ha:
        enabled: false
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].image
          # IN CASE OF AN INTENTIONAL MAJOR BUMP, ADJUST THIS TEST
          pattern: bitnamilegacy/postgresql:17.+$
  - it: "[valkey] Detect major image version upgrades"
    template: charts/valkey/templates/deploy_valkey.yaml
    set:
      valkey:
        enabled: true
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].image
          # IN CASE OF AN INTENTIONAL MAJOR BUMP, ADJUST THIS TEST
          pattern: valkey/valkey:9.+$
