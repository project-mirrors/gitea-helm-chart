suite: Dependency checks | Customization integrity | postgresql
release:
  name: gitea-unittests
  namespace: testing
set:
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: true
    global:
      postgresql:
        auth:
          password: gitea-password
          database: gitea-database
          username: gitea-username
        service:
          ports:
            postgresql: 1234
    primary:
      persistence:
        size: 1337Mi
tests:
  - it: "[postgresql] Apply the database settings"
    template: charts/postgresql/templates/primary/statefulset.yaml
    asserts:
      - documentIndex: 0
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE
            value: "gitea-database"
      - documentIndex: 0
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: "gitea-username"
  - it: "[postgresql] Apply the database password"
    template: charts/postgresql/templates/secrets.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: data["password"]
          value: "Z2l0ZWEtcGFzc3dvcmQ="
  - it: "[postgresql] Apply primary.persistence.size"
    template: charts/postgresql/templates/primary/statefulset.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "1337Mi"
  - it: "[postgresql] Apply global.postgresql.service.ports.postgresql"
    template: charts/postgresql/templates/primary/svc.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.ports[0].port
          value: 1234
  - it: "[postgresql] Render the referenced Service"
    template: charts/postgresql/templates/primary/svc.yaml
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: gitea-unittests-postgresql
          namespace: testing
  - it: "[gitea] Connect to the postgresql Service"
    template: templates/secret_inlineConfig.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.database
          decodeBase64: true
          pattern: HOST=gitea-unittests-postgresql.testing.svc.cluster.local:1234
  - it: "[gitea] Connect to the postgresql Service with a custom cluster domain"
    set:
      clusterDomain: my-special-cluster.local
    template: templates/secret_inlineConfig.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.database
          decodeBase64: true
          pattern: HOST=gitea-unittests-postgresql.testing.svc.my-special-cluster.local:1234
  - it: "[gitea] Connect to the configured database"
    template: templates/secret_inlineConfig.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.database
          decodeBase64: true
          pattern: NAME=gitea-database
      - documentIndex: 0
        matchRegex:
          path: data.database
          decodeBase64: true
          pattern: USER=gitea-username
      - documentIndex: 0
        matchRegex:
          path: data.database
          decodeBase64: true
          pattern: PASSWD=gitea-password
