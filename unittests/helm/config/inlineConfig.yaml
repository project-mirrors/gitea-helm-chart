suite: Test config inlineConfig
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/secret_inlineConfig.yaml
tests:
  - it: "Render the inline config of data.server via tpl"
    set:
      global.giteaHostName: "gitea.example.com"
      ingress.enabled: true
      ingress.hosts[0].host: "{{ .Values.global.giteaHostName }}"
      ingress.tls:
        - secretName: gitea-tls
          hosts:
            - "{{ .Values.global.giteaHostName }}"
    asserts:
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: .*-inline-config$
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: DOMAIN=gitea\.example\.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: ROOT_URL=https://gitea\.example\.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: SSH_DOMAIN=gitea\.example\.com
  - it: "Render data instead of stringData so removed sections are pruned on upgrade"
    asserts:
      - documentIndex: 0
        notExists:
          path: stringData
      - documentIndex: 0
        exists:
          path: data.server
