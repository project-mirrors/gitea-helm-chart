suite: config template | config_environment.sh
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/secret_admin.yaml
  - templates/secret_config.yaml
tests:
  - it: "Write app.ini from the environment variables via `gitea config edit-ini`"
    template: templates/secret_config.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data["config_environment.sh"]
          decodeBase64: true
          pattern: 'gitea config edit-ini --apply-env --config .+GITEA_APP_INI.+ --out .+GITEA_APP_INI'
  - it: "Render data instead of stringData so removed keys are pruned on upgrade"
    template: templates/secret_config.yaml
    asserts:
      - documentIndex: 0
        notExists:
          path: stringData
      - documentIndex: 0
        exists:
          path: data["config_environment.sh"]
