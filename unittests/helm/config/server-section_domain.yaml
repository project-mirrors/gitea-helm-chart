suite: Test config server domain
release:
  name: gitea-unittests
  namespace: testing
tests:
  - it: "[default values] Use the ingress host for DOMAIN|SSH_DOMAIN|ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nDOMAIN=git.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nSSH_DOMAIN=git.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=http://git.example.com

  ################################################

  - it: "[no ingress hosts] Use the HTTP Service for DOMAIN|SSH_DOMAIN|ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    set:
      ingress:
        hosts: []
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nDOMAIN=gitea-unittests-http.testing.svc.cluster.local
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nSSH_DOMAIN=gitea-unittests-http.testing.svc.cluster.local
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=http://gitea-unittests-http.testing.svc.cluster.local

  ################################################

  - it: "[provided via values] Use the configured values for DOMAIN|SSH_DOMAIN|ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    set:
      gitea.config.server.DOMAIN: provided.example.com
      ingress:
        hosts:
          - host: non-used.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nDOMAIN=provided.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nSSH_DOMAIN=provided.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=http://provided.example.com

  ################################################

  - it: "[route enabled] Use the Route host for DOMAIN|SSH_DOMAIN|ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    set:
      route:
        enabled: true
        host: route.example.com
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nDOMAIN=route.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nSSH_DOMAIN=route.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=http://route.example.com

  ################################################

  - it: "[route tls termination] Use https for ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    set:
      route:
        enabled: true
        host: route.example.com
        tls:
          termination: edge
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=https://route.example.com

  ################################################

  - it: "[HTTPRoute enabled] Use the first hostname for DOMAIN|SSH_DOMAIN|ROOT_URL"
    template: templates/secret_inlineConfig.yaml
    set:
      ingress:
        hosts: []
      gatewayAPI:
        enabled: true
        core:
          httpRoute:
            enabled: true
            hostnames:
              - gw.example.com
            parentRefs:
              - name: shared-gateway
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nDOMAIN=gw.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nSSH_DOMAIN=gw.example.com
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=http://gw.example.com

  ################################################

  - it: "[HTTPRoute tls] Switch ROOT_URL to https"
    template: templates/secret_inlineConfig.yaml
    set:
      ingress:
        hosts: []
      gatewayAPI:
        enabled: true
        core:
          httpRoute:
            enabled: true
            tls: true
            hostnames:
              - gw.example.com
            parentRefs:
              - name: shared-gateway
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data.server
          decodeBase64: true
          pattern: \nROOT_URL=https://gw.example.com
