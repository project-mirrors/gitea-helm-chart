suite: Test config metrics token
release:
  name: gitea-unittests
  namespace: testing
tests:
  - it: "Configure the metrics token when it is set"
    template: templates/secret_inlineConfig.yaml
    set:
      gitea:
        metrics:
          enabled: true
          token: "somepassword"
    asserts:
      - documentIndex: 0
        equal:
          path: data.metrics
          decodeBase64: true
          value: |-
            ENABLED=true
            TOKEN=somepassword
  - it: "Omit the metrics token when it is empty"
    template: templates/secret_inlineConfig.yaml
    set:
      gitea:
        metrics:
          enabled: true
          token: ""
    asserts:
      - documentIndex: 0
        equal:
          path: data.metrics
          decodeBase64: true
          value: |-
            ENABLED=true
  - it: "Omit the metrics token when it is nil"
    template: templates/secret_inlineConfig.yaml
    set:
      gitea:
        metrics:
          enabled: true
          token:
    asserts:
      - documentIndex: 0
        equal:
          path: data.metrics
          decodeBase64: true
          value: |-
            ENABLED=true
  - it: "Omit the metrics token when metrics are disabled"
    template: templates/secret_inlineConfig.yaml
    set:
      gitea:
        metrics:
          enabled: false
          token: "somepassword"
    asserts:
      - documentIndex: 0
        equal:
          path: data.metrics
          decodeBase64: true
          value: |-
            ENABLED=false
