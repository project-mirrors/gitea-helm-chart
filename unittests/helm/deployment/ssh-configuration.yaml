suite: deployment template (SSH configuration)
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/deployment.yaml
  - templates/secret_admin.yaml
  - templates/secret_config.yaml
  - templates/secret_gpg.yaml
  - templates/secret_init.yaml
  - templates/secret_inlineConfig.yaml
  - templates/secret_metrics.yaml
tests:
  - it: "Define the SSH log level for the root based image"
    template: templates/deployment.yaml
    set:
      deployment.gitea.image.rootless: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSH_LOG_LEVEL
            value: "INFO"
  - it: "Override the SSH log level"
    template: templates/deployment.yaml
    set:
      deployment.gitea.image.rootless: false
      gitea.ssh.logLevel: "DEBUG"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSH_LOG_LEVEL
            value: "DEBUG"
  - it: "Override the SSH log level when image.fullOverride is set"
    template: templates/deployment.yaml
    set:
      deployment.gitea.image.fullOverride: docker.gitea.com/gitea:1.19.3
      deployment.gitea.image.rootless: false
      gitea.ssh.logLevel: "DEBUG"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSH_LOG_LEVEL
            value: "DEBUG"
  - it: "Skip SSH_LOG_LEVEL for the rootless image"
    template: templates/deployment.yaml
    set:
      deployment.gitea.image.rootless: true
      gitea.ssh.logLevel: "DEBUG" # explicitly defining a non-standard level here
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SSH_LOG_LEVEL
  - it: "Skip SSH_LOG_LEVEL for the rootless image when image.fullOverride is set"
    template: templates/deployment.yaml
    set:
      deployment.gitea.image.fullOverride: docker.gitea.com/gitea:1.19.3
      deployment.gitea.image.rootless: true
      gitea.ssh.logLevel: "DEBUG" # explicitly defining a non-standard level here
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SSH_LOG_LEVEL
