suite: ServiceMonitor template (monitoring enabled)
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/serviceMonitor.yaml
tests:
  - it: "Render an unsecured ServiceMonitor when gitea.metrics.token is nil"
    set:
      gitea.metrics.enabled: true
      gitea.metrics.token:
      gitea.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        containsDocument:
          kind: ServiceMonitor
          apiVersion: monitoring.coreos.com/v1
          name: gitea-unittests
      - isNotNullOrEmpty:
          path: metadata.labels
      - equal:
          path: spec.endpoints
          value:
            - port: http
  - it: "Render an unsecured ServiceMonitor when gitea.metrics.token is empty"
    set:
      gitea.metrics.enabled: true
      gitea.metrics.token: ""
      gitea.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        containsDocument:
          kind: ServiceMonitor
          apiVersion: monitoring.coreos.com/v1
          name: gitea-unittests
      - isNotNullOrEmpty:
          path: metadata.labels
      - equal:
          path: spec.endpoints
          value:
            - port: http
  - it: "Render a secured ServiceMonitor when gitea.metrics.token is not empty"
    set:
      gitea.metrics.enabled: true
      gitea.metrics.token: "test-token"
      gitea.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        containsDocument:
          kind: ServiceMonitor
          apiVersion: monitoring.coreos.com/v1
          name: gitea-unittests
      - isNotNullOrEmpty:
          path: metadata.labels
      - equal:
          path: spec.endpoints
          value:
            - port: http
              authorization:
                type: Bearer
                credentials:
                  name: gitea-unittests-metrics
                  key: token
                  optional: false
