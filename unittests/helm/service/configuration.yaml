suite: Test httpService and sshService configuration
release:
  name: gitea-unittests
  namespace: testing
templates:
  - templates/service_ssh.yaml
  - templates/service_http.yaml
tests:
  - it: "Add custom labels to the SSH Service"
    template: templates/service_ssh.yaml
    set:
      service:
        ssh:
          labels:
            gitea/testkey: testvalue
    asserts:
      - equal:
          path: metadata.labels["gitea/testkey"]
          value: "testvalue"

  - it: "Keep the existing labels of the SSH Service"
    template: templates/service_ssh.yaml
    set:
      service:
        ssh:
          labels: {}
    asserts:
      - exists:
          path: metadata.labels["app"]

  - it: "Add custom labels to the HTTP Service"
    template: templates/service_http.yaml
    set:
      service:
        http:
          labels:
            gitea/testkey: testvalue
    asserts:
      - equal:
          path: metadata.labels["gitea/testkey"]
          value: "testvalue"

  - it: "Keep the existing labels of the HTTP Service"
    template: templates/service_http.yaml
    set:
      service:
        http:
          labels: {}
    asserts:
      - exists:
          path: metadata.labels["app"]

  - it: "Render service.ssh.loadBalancerClass when the type is LoadBalancer"
    template: templates/service_ssh.yaml
    set:
      service:
        ssh:
          loadBalancerClass: "example.com/class"
          type: LoadBalancer
          loadBalancerIP: "1.2.3.4"
          loadBalancerSourceRanges:
            - "1.2.3.4/32"
            - "5.6.7.8/32"
    asserts:
      - equal:
          path: spec.loadBalancerClass
          value: "example.com/class"
      - equal:
          path: spec.loadBalancerIP
          value: "1.2.3.4"
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["1.2.3.4/32", "5.6.7.8/32"]

  - it: "Skip the loadBalancer properties when the type is not LoadBalancer"
    template: templates/service_http.yaml
    set:
      service:
        http:
          type: ClusterIP
          loadBalancerClass: "example.com/class"
          loadBalancerIP: "1.2.3.4"
          loadBalancerSourceRanges:
            - "1.2.3.4/32"
            - "5.6.7.8/32"
    asserts:
      - notExists:
          path: spec.loadBalancerClass
      - notExists:
          path: spec.loadBalancerIP
      - notExists:
          path: spec.loadBalancerSourceRanges

  - it: "Skip loadBalancerClass by default even when the type is LoadBalancer"
    template: templates/service_http.yaml
    set:
      service:
        http:
          type: LoadBalancer
          loadBalancerIP: "1.2.3.4"
    asserts:
      - notExists:
          path: spec.loadBalancerClass
      - equal:
          path: spec.loadBalancerIP
          value: "1.2.3.4"

  - it: "Render both the SSH and the HTTP Service"
    templates:
      - templates/service_ssh.yaml
      - templates/service_http.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^gitea-unittests-(?:ssh|http)$"
      - matchRegex:
          path: spec.ports[0].name
          pattern: "^(?:ssh|http)$"
