---
extends: default
ignore: |
  charts
  .yamllint
  node_modules
  templates
  unittests/bash

rules:
  braces:
    max-spaces-inside: 2
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  line-length: disable
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
    level: error
